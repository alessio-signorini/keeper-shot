name: deploy
on:
  push: { branches: [main, master] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund --prefer-offline
      # Build (includes tsc) and unit tests run in parallel; either failing blocks deploy.
      - run: |
          npm run build & build=$!
          npm run test & test=$!
          rc=0
          wait $build || rc=1
          wait $test || rc=1
          exit $rc
      # Publish dist as a single commit on the gh-pages branch.
      - run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
